document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

eements, compliance and approvals still move as attachments unless the product absorbs them.'},\n          {n:'04', title:'Search that works', body:'Buyers filter on things the schema was never designed for. Search needs room to change.'}\n        ],\n        builds:[\n          {n:'01', title:'Property platforms', body:'Listings, media, search and enquiry in one product.'},\n          {n:'02', title:'Real estate CRM', body:'Pipeline, follow-up and agent performance in one place.'},\n          {n:'03', title:'Property management', body:'Tenancies, rent, maintenance and owner reporting.'},\n          {n:'04', title:'Marketplaces', body:'Two-sided platforms connecting buyers, sellers and agents.'},\n          {n:'05', title:'Document workflows', body:'Agreements, approvals and e-signature built into the flow.'},\n          {n:'06', title:'Real estate SaaS', body:'Multi-tenant products for agencies and developers.'}\n        ],\n        tech:['Next.js','Node.js','PostgreSQL','Elasticsearch','Mapbox','AWS','Redis'],\n        approach:'We treat search and lead routing as the product, not features of it. The data pipeline that dedupes and geocodes listings gets built before the interface, because everything downstream depends on it.'\n      },\n      { slug:'education', name:'Education', stage:2,\n        h1a:'Learning platforms', h1b:'people finish.',\n        blurb:'LMS, edtech products, assessment, student systems',\n        sub:'Eight edtech platforms shipped. Completion is the only metric that matters, and it is decided by structure and pace long before it is decided by content.',\n        challenges:[\n          {n:'01', title:'Completion rates', body:'Most learners stop early. Structure, pacing and reminders move the number more than features do.'},\n          {n:'02', title:'Live at scale', body:'A cohort session with thousands of concurrent learners is an infrastructure problem, not a video problem.'},\n          {n:'03', title:'Assessment integrity', body:'Marki and operations.'),\n          cs('Zapp','zapp','img/cs/zapp/zaap2.png','On-demand delivery at metropolitan scale.')\n        ]\n      },\n      { slug:'media', name:'Media', stage:2,\n        h1a:'Platforms for content', h1b:'and the people making it.',\n        blurb:'OTT, streaming, content and creator platforms',\n        sub:'Media products are judged on playback and discovery. Both are infrastructure problems dressed as design problems.',\n        challenges:[\n          {n:'01', title:'Playback quality', body:'Startup time and rebuffering decide retention more than catalogue size does.'},\n          {n:'02', title:'Delivery cost', body:'Bandwidth is the dominant line item. Encoding and CDN strategy is a business decision.'},\n          {n:'03', title:'Rights and windows', body:'Content availability varies by territory and date, and the system has to enforce it.'},\n          {n:'04', title:'Discovery', body:'A large catalogue without good discovery performs worse than a small one.'}\n        ],\n        builds:[\n          {n:'01', title:'OTT platforms', body:'Catalogue, playback and entitlement across devices.'},\n          {n:'02', title:'Streaming infrastructure', body:'Encoding, packaging and delivery pipelines.'},\n          {n:'03', title:'Content platforms', body:'Publishing, editorial workflow and syndication.'},\n          {n:'04', title:'Creator platforms', body:'Upload, monetisation and audience tooling.'},\n          {n:'05', title:'Subscription billing', body:'Plans, trials, churn handling and dunning.'},\n          {n:'06', title:'Recommendation', body:'Discovery driven by behaviour rather than editorial alone.'}\n        ],\n        tech:['React','Next.js','Node.js','Python','PostgreSQL','AWS','Cloudflare','HLS / DASH'],\n        approach:'We instrument playback before anything else, because startup time and rebuffer rate tell you what to fix. Rights and windowing get modelled as data so business teams can change them without a release.'\n      },\n      { slug:'startups', name:'Startups', stage:0,\n        h1a:'From idea', h1b:'to something real.',\n        blurb:'MVPs, SaaS, marketplaces, scalable backends',\n        sub:'Founders come to us with a product to prove. The job is finding the smallest version that answers the question, building it properly, and not painting you into a corner.',\n        challenges:[\n          {n:'01', title:'Scope discipline', body:'The first version usually contains three products. Deciding which one ships is most of the value.'},\n          {n:'02', title:'Runway', body:'Every week of build is a week of runway. Sequencing matters more than velocity.'},\n          {n:'03', title:'Premature scale', body:'Architecture built for a million users you do not have slows down the ten you do.'},\n          {n:'04', title:'Handover', body:'When you hire your own team, they inherit our decisions. They should be able to live with them.'}\n        ],\n        builds:[\n          {n:'01', title:'MVP development', body:'The smallest build that tests the real assumption.'},\n          {n:'02', title:'SaaS products', body:'Multi-tenancy, billing and onboarding done once, properly.'},\n          {n:'03', title:'Marketplaces', body:'Two-sided products with payments and trust mechanics.'},\n          {n:'04', title:'Mobile applications', body:'Native and cross-platform from wireframe to store.'},\n          {n:'05', title:'Scalable backends', body:'Services that grow without a rewrite at the first inflection.'},\n          {n:'06', title:'Technical due diligence', body:'An honest read on an existing codebase before you raise.'}\n        ],\n        tech:['Next.js','React Native','Node.js','TypeScript','PostgreSQL','Supabase','AWS','Stripe'],\n        approach:'We run a short paid discovery, cut the scope to what tests the assumption, and give you a fixed number. Boring technology by default, because your advantage is the product and not the stack.'\n      },\n      { slug:'enterprise', name:'Enterprise', stage:3,\n        h1a:'Systems the business', h1b:'actually runs on.',\n        blurb:'ERP, CRM, internal platforms, integrations',\n        sub:'Enterprise work is mostly integration and migration under a constraint nobody can relax: the current system has to keep running while you change it.',\n        challenges:[\n          {n:'01', title:'Legacy dependency', body:'The system you want to replace is load-bearing and undocumented.'},\n          {n:'02', title:'Integration surface', body:'A dozen systems, several vendors and no single owner of the data model.'},\n          {n:'03', title:'Change resistance', body:'Adoption fails on process and training long before it fails on software.'},\n          {n:'04', title:'Migration risk', body:'Cutover is the moment everything is exposed. It has to be rehearsed and reversible.'}\n        ],\n        builds:[\n          {n:'01', title:'ERP implementation', body:'Configuration, customisation and rollout.'},\n          {n:'02', title:'CRM platforms', body:'Pipeline, service and reporting fitted to your process.'},\n          {n:'03', title:'Internal platforms', body:'Tools your operations teams live inside all day.'},\n          {n:'04', title:'Workflow automation', body:'Approvals and handoffs that stop living in email.'},\n          {n:'05', title:'System integration', body:'APIs and pipelines connecting what you already own.'},\n          {n:'06', title:'Migration', body:'Staged, rehearsed and reversible cutover.'}\n        ],\n        tech:['.NET','Java / Spring','React','PostgreSQL','Azure','Terraform','Kafka','Power BI'],\n        approach:'We map the current system before proposing the next one, run new and old in parallel where we can, and rehearse cutover until it is boring. Training and documentation are part of scope, not an afterthought.'\n      },\n      { slug:'quick-commerce', name:'Quick commerce', stage:3,\n        h1a:'Ten-minute promises,', h1b:'kept.',\n        blurb:'Dark stores, rider dispatch, sub-hour delivery',\n        sub:'Seven quick-commerce platforms shipped. The promise on the homepage is an engineering commitment: inventory accuracy, rider supply and dispatch have to hold simultaneously.',\n        challenges:[\n          {n:'01', title:'Dark store inventory', body:'Stock accuracy per store decides whether the promise is deliverable or a cancellation.'},\n          {n:'02', title:'Rider supply', body:'Demand spikes in twenty-minute windows. Supply has to be forecast, not reacted to.'},\n          {n:'03', title:'Slot honesty', body:'Showing a delivery window you cannot meet costs more than showing a longer one.'},\n          {n:'04', title:'Unit economics', body:'Every extra minute and every failed drop is measurable margin.'}\n        ],\n        builds:[\n          {n:'01', title:'Customer apps', body:'Browse, order and live tracking on iOS and Android.'},\n          {n:'02', title:'Rider apps', body:'Assignment, navigation and proof of delivery.'},\n          {n:'03', title:'Dark store tooling', body:'Picking, stock counts and store-level availability.'},\n          {n:'04', title:'Dispatch engine', body:'Batching and assignment under time pressure.'},\n          {n:'05', title:'Slot and pricing logic', body:'Dynamic windows and fees tied to real capacity.'},\n          {n:'06', title:'Operations dashboards', body:'Live performance per store and per rider.'}\n        ],\n        tech:['React Native','Node.js','PostgreSQL','Redis','Kafka','Kubernetes','Maps APIs'],\n        approach:'We model store-level inventory as the source of truth and refuse to show a slot the system cannot back. Dispatch is a service with replay tooling so any assignment decision can be audited later.',\n        caseNote:'Seven quick-commerce platforms shipped',\n        cases:[\n          cs('MILKRUN','milkrun','img/cs/milkrun/milkrun1.png','Grocery delivery with rider dispatch and live tracking.'),\n          cs('Zapp','zapp','img/cs/zapp/zaap2.png','On-demand delivery at metropolitan scale.'),\n          cs('Grokart','thegrocart','img/cs/thegrocart/thegrocart1.png','Grocery commerce with store-level fulfilment.')\n        ]\n      },\n      { slug:'insurance', name:'Insurance', stage:1,\n        h1a:'Insurance software', h1b:'without the paper.',\n        blurb:'Quoting, policy admin, claims, distribution',\n        sub:'Insurance runs on rules that change by product, territory and regulator. We build systems where those rules are configurable data rather than hard-coded logic.',\n        challenges:[\n          {n:'01', title:'Rating complexity', body:'Premium logic varies per product and changes often. Hard-coding it guarantees release pressure.'},\n          {n:'02', title:'Claims turnaround', body:'Customers judge insurers on claims, and claims are mostly document handling.'},\n          {n:'03', title:'Legacy policy systems', body:'The core admin platform is old, load-bearing and rarely well documented.'},\n          {n:'04', title:'Regulatory reporting', body:'Returns and disclosures have fixed formats and unforgiving deadlines.'}\n        ],\n        builds:[\n          {n:'01', title:'Quote and buy', body:'Rating, underwriting questions and checkout.'},\n          {n:'02', title:'Policy administration', body:'Issuance, endorsements, renewals and cancellation.'},\n          {n:'03', title:'Claims platforms', body:'Intake, document handling, assessment and settlement.'},\n          {n:'04', title:'Agent and broker portals', body:'Distribution tooling with commission tracking.'},\n          {n:'05', title:'Customer self-service', body:'Documents, changes and claims without a phone call.'},\n          {n:'06', title:'Regulatory reporting', body:'Scheduled returns generated from the system of record.'}\n        ],\n        tech:['Java / Spring','.NET','React','PostgreSQL','Azure','Kafka','Power BI'],\n        approach:'Rating and underwriting rules get modelled as versioned configuration so product teams can change them  justify.',\n        caseNote:'ERP delivered for Vimal Wires & Cable',\n        cases:[\n          cs('Vimal Wires & Cable','vimal-wires-and-cable','img/vimal-cables-thumb.webp','ERP system covering production and operations.')\n        ]\n      },\n      { slug:'public-sector', name:'Public sector', stage:2,\n        h1a:'Services citizens', h1b:'can actually use.',\n        blurb:'Citizen portals, case management, accessibility',\n        sub:'Public software is judged on whether the least confident user can complete the task. Accessibility and documentation are requirements here, not improvements.',\n        challenges:[\n          {n:'01', title:'Universal accessibility', body:'The service must work for every citizen, on old devices and assistive technology.'},\n          {n:'02', title:'Procurement constraints', body:'Scope, reporting and evidence obligations are fixed before work starts.'},\n          {n:'03', title:'Legacy integration', body:'Records live in systems that predate the web and cannot be switched off.'},\n          {n:'04', title:'Transparency', body:'Decisions and data handling have to be explainable to the public.'}\n        ],\n        builds:[\n          {n:'01', title:'Citizen portals', body:'Applications, payments and status tracking.'},\n          {n:'02', title:'Case management', body:'Workflow, assessment and decision recording.'},\n          {n:'03', title:'Licensing systems', body:'Permits, renewals and inspection scheduling.'},\n          {n:'04', title:'Internal platforms', body:'Tooling for caseworkers and administrators.'},\n          {n:'05', title:'Open data', body:'Published datasets and documented APIs.'},\n          {n:'06', title:'Legacy integration', body:'Bridges to existing systems of record.'}\n        ],\n        tech:['React','Node.js','.NET','PostgreSQL','Azure','Terraform','GOV-style patterns'],\n        approach:'We build to WCAG AA and test with assistive technology rather than a checklist. Everything ships with the documentation and evidence procurement requires, produced as we go rather than at the end.'\n      },\n      { slug:'agritech', name:'Agritech', stage:0,\n        h1a:'Software for fields,', h1b:'not just offices.',\n        blurb:'Farm management, supply chain, advisory, marketplaces',\n        sub:'Agricultural software runs where connectivity is unreliable and the user may not be reading in English. Offline-first is a requirement, not a feature.',\n        challenges:[\n          {n:'01', title:'Connectivity', body:'Fields have patchy coverage. Anything requiring a live connection will fail in use.'},\n          {n:'02', title:'Language and literacy', body:'Interfaces need multiple languages and to work with minimal reading.'},\n          {n:'03', title:'Seasonality', body:'Usage concentrates into short windows, so releases must land between them.'},\n          {n:'04', title:'Fragmented supply chain', body:'Many small intermediaries, little digitisation and inconsistent records.'}\n        ],\n        builds:[\n          {n:'01', title:'Farm management', body:'Plots, crops, inputs and activity records.'},\n          {n:'02', title:'Advisory apps', body:'Guidance, alerts and diagnostics in local languages.'},\n          {n:'03', title:'Supply chain platforms', body:'Procurement, grading and payment tracking.'},\n          {n:'04', title:'Marketplaces', body:'Connecting producers to buyers with price transparency.'},\n          {n:'05', title:'Traceability', body:'Origin records from farm to buyer.'},\n          {n:'06', title:'Field data capture', body:'Offline-first collection that syncs when it can.'}\n        ],\n        tech:['React Native','Flutter','Node.js','PostgreSQL','SQLite','Firebase','Maps APIs'],\n        approach:'Every field-facing app is offline-first with conflict resolution designed in from the start. We test on low-end devices and in local languages, because that is what is actually in the user\\'s hand.'\n      },\n      { slug:'fitness', name:'Sports & fitness', stage:4,\n        h1a:'Products people', h1b:'come back to.',\n        blurb:'Training apps, class booking, wearables, communities',\n        sub:'Fitness products are retention businesses. Habit mechanics and honest data matter more than feature count.',\n        challenges:[\n          {n:'01', title:'Retention', body:'Most users lapse within weeks. Streaks, reminders and social pressure move the number.'},\n          {n:'02', title:'Wearable data', body:'Device APIs disagree, sync late and report the same activity differently.'},\n          {n:'03', title:'Background tracking', body:'Continuous tracking has to work without destroying battery life.'},\n          {n:'04', title:'Trust in numbers', body:'Users abandon a product the moment its data contradicts their own sense of effort.'}\n        ],\n        builds:[\n          {n:'01', title:'Training apps', body:'Programmes, progression and workout logging.'},\n          {n:'02', title:'Class booking', body:'Schedules, capacity, waitlists and memberships.'},\n          {n:'03', title:'Wearable integration', body:'Apple Health, Google Fit and device SDKs reconciled.'},\n          {n:'04', title:'Community features', body:'Challenges, leaderboards and social accountability.'},\n          {n:'05', title:'Coach platforms', body:'Client management, plan building and messaging.'},\n          {n:'06', title:'Subscription billing', body:'Plans, pauses, trials and churn handling.'}\n        ],\n        tech:['React Native','Swift','Kotlin','Node.js','PostgreSQL','Firebase','HealthKit','Stripe'],\n        approach:'We instrument the retention curve first and design against the week where users drop off. Wearable data gets reconciled through one normalisation layer so the product shows a single believable number.'\n      }\n    ];\n  }\n\n  serviceData(){\n    return [\n      { slug:'product-engineering', name:'Product engineering', tag:'Discovery, architecture, build, handover', stage:0,\n        label:'Service 01 / Product engineering',\n        h1a:'Products built', h1b:'to be owned.',\n        sub:'Full-cycle product work: the discovery that decides what to build, the architecture that survives contact with users, and a handover that leaves your team able to run it without us.',\n        includes:[\n          {n:'01', title:'Paid discovery', body:'A brief turned into architecture, a plan and a fixed number.'},\n          {n:'02', title:'Architecture', body:'Data model, service boundaries and the decisions written down.'},\n          {n:'03', title:'Build', body:'Two-week sprints, a demo at the end of each, a board open daily.'},\n          {n:'04', title:'Release engineering', body:'Pipelines, environments and staged rollout from sprint one.'},\n          {n:'05', title:'Observability', body:'Logging, metrics and alerting in place before real users arrive.'},\n          {n:'06', title:'Handover', body:'Documentation and walkthroughs so your team can take it over.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Working software', body:'Deployed, monitored and in your cloud account.'},\n          {n:'02', title:'Architecture record', body:'Decisions and their reasons, not just diagrams.'},\n          {n:'03', title:'Test coverage', body:'Automated suites you can trust to gate a release.'},\n          {n:'04', title:'Runbook', body:'What to do when something breaks at 3am.'}\n        ],\n        tech:['TypeScript','Node.js','React','PostgreSQL','Docker','Terraform','AWS','GitHub Actions'],\n        approach:'Discovery is paid and short, because free discovery produces optimistic estimates. After that we work in two-week sprints with a demo at the end of every one, and you see the same board we do.'\n      },\n      { slug:'web-mobile', name:'Web & mobile', tag:'React, Next.js, React Native, Flutter', stage:1,\n        label:'Service 02 / Web & mobile',\n        h1a:'Interfaces', h1b:'that stay fast.',\n        sub:'Web applications and native apps from first wireframe to store release, engineered to stay quick under load and easy to change six months later.',\n        includes:[\n          {n:'01', title:'Web applications', body:'Portals, dashboards and products built on React or Next.js.'},\n          {n:'02', title:'Native mobile', body:'iOS and Android via React Native, Flutter or platform native.'},\n          {n:'03', title:'Design systems', body:'Component libraries your team can extend without us.'},\n          {n:'04', title:'Performance work', body:'Core Web Vitals, bundle budgets and render profiling.'},\n          {n:'05', title:'Accessibility', body:'Keyboard, screen reader and contrast to WCAG AA.'},\n          {n:'06', title:'Store release', body:'Submission, review handling and staged rollout.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Shipped app', body:'Live on the web or in both app stores.'},\n          {n:'02', title:'Component library', body:'Documented and reusable across your products.'},\n          {n:'03', title:'Performance budget', body:'Targets wired into CI so regressions fail the build.'},\n          {n:'04', title:'Release pipeline', body:'Automated builds and signing you control.'}\n        ],\n        tech:['React','Next.js','TypeScript','React Native','Flutter','Tailwind','Vite','Playwright'],\n        approach:'We set performance and accessibility budgets at the start and enforce them in CI, because both are cheap to hold and expensive to retrofit. Design and engineering work in the same sprint, not in sequence.'\n      },\n      { slug:'saas-platforms', name:'SaaS & platforms', tag:'Multi-tenancy, billing, scale', stage:2,\n        label:'Service 03 / SaaS & platforms',\n        h1a:'Platforms built', h1b:'for the thousandth customer.',\n        sub:'Multi-tenancy, billing, onboarding and the operational tooling that decides whether a SaaS product is a business or a demo.',\n        includes:[\n          {n:'01', title:'Tenancy model', body:'Isolation, sharing and migration decided before launch.'},\n          {n:'02', title:'Billing', body:'Plans, trials, proration, dunning and revenue reporting.'},\n          {n:'03', title:'Onboarding', body:'Signup, provisioning and time-to-first-value flows.'},\n          {n:'04', title:'Admin tooling', body:'The internal console your support team needs on day one.'},\n          {n:'05', title:'Usage metering', body:'Limits, quotas and the data behind usage-based pricing.'},\n          {n:'06', title:'Scale work', body:'Caching, queues and read replicas ahead of the curve.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Multi-tenant platform', body:'Provisioned, metered and billable.'},\n          {n:'02', title:'Billing integration', body:'Reconciled against your provider, not approximated.'},\n          {n:'03', title:'Admin console', body:'Support actions without database access.'},\n          {n:'04', title:'Capacity plan', body:'What breaks first, and at what number.'}\n        ],\n        tech:['Next.js','Node.js','PostgreSQL','Redis','Stripe','Kubernetes','Terraform','Grafana'],\n        approach:'The tenancy and billing model gets decided in week one, because both are painful to change later. We build the admin console early so support never needs production database access.'\n      },\n      { slug:'crm-erp', name:'CRM & ERP', tag:'Implementation, customisation, integration', stage:3,\n        label:'Service 04 / CRM & ERP',\n        h1a:'The systems', h1b:'your operations live in.',\n        sub:'Implementation, customisation and the integration work that connects the systems your sales and operations teams use all day to everything else you own.',\n        includes:[\n          {n:'01', title:'Implementation', body:'Configuration and rollout fitted to your actual process.'},\n          {n:'02', title:'Customisation', body:'Modules and workflows the standard product will not do.'},\n          {n:'03', title:'Integration', body:'APIs and pipelines to finance, commerce and logistics.'},\n          {n:'04', title:'Data migration', body:'Cleaned, mapped and rehearsed before cutover.'},\n          {n:'05', title:'Reporting', body:'Dashboards built on one agreed definition of each metric.'},\n          {n:'06', title:'Training', body:'Sessions and documentation so adoption actually happens.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Live system', body:'In use by the teams it was built for.'},\n          {n:'02', title:'Integration map', body:'Every connection documented and monitored.'},\n          {n:'03', title:'Migration record', body:'What moved, what did not, and why.'},\n          {n:'04', title:'Training material', body:'Written for your process, not the vendor manual.'}\n        ],\n        tech:['.NET','Java / Spring','React','PostgreSQL','Azure','Kafka','Power BI','Terraform'],\n        approach:'We map the current process before proposing the new one, run old and new in parallel where possible, and rehearse cutover until it is boring. Training and documentation are in scope, not an afterthought.'\n      },\n      { slug:'cloud-infrastructure', name:'Cloud & infrastructure', tag:'AWS, Azure, GCP, Kubernetes, IaC', stage:4,\n        label:'Service 05 / Cloud & infrastructure',\n        h1a:'Deployment', h1b:'stops being an event.',\n        sub:'Migration, infrastructure as code, CI/CD and cost control, so releasing becomes routine and your cloud bill stops being a surprise.',\n        includes:[\n          {n:'01', title:'Cloud migration', body:'Staged, reversible moves to AWS, Azure or GCP.'},\n          {n:'02', title:'Infrastructure as code', body:'Terraform modules, reviewed like application code.'},\n          {n:'03', title:'CI/CD', body:'Build, test and deploy pipelines with real gates.'},\n          {n:'04', title:'Kubernetes', body:'Clusters, autoscaling and workload isolation.'},\n          {n:'05', title:'Observability', body:'Metrics, traces, logs and alerts that page   {n:'01', title:'Design system', body:'Documented components, not a folder of artboards.'},\n          {n:'02', title:'Annotated screens', body:'States, errors and empty cases specified.'},\n          {n:'03', title:'Research findings', body:'What users actually did, with recordings.'},\n          {n:'04', title:'Handover spec', body:'Spacing, behaviour and motion your devs can read.'}\n        ],\n        tech:['Figma','Design tokens','Storybook','Framer','Maze','Tailwind'],\n        approach:'We design against real content and real constraints, including the ugly states most portfolios skip. Every screen ships with its loading, empty and error case, because those are where products actually fail.'\n      },\n      { slug:'qa-testing', name:'QA & test automation', tag:'Coverage, performance, security, release gates', stage:2,\n        label:'Service 07 / QA & test automation',\n        h1a:'Find it before', h1b:'your users do.',\n        sub:'Manual and automated coverage, performance and security testing, and release gates that stop a bad build reaching production.',\n        includes:[\n          {n:'01', title:'Test strategy', body:'What to automate, what to test by hand, and why.'},\n          {n:'02', title:'Automation suites', body:'Unit, integration and end-to-end running in CI.'},\n          {n:'03', title:'Manual and exploratory', body:'Human testing where judgment beats a script.'},\n          {n:'04', title:'Performance testing', body:'Load, soak and spike against realistic traffic.'},\n          {n:'05', title:'Security testing', body:'OWASP coverage, dependency and penetration testing.'},\n          {n:'06', title:'Release gates', body:'Quality thresholds that fail the build, not a meeting.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Automated suite', body:'Running on every commit, owned by your team.'},\n          {n:'02', title:'Coverage report', body:'What is tested, what is not, and the risk.'},\n          {n:'03', title:'Performance baseline', body:'Numbers to compare every future release against.'},\n          {n:'04', title:'Defect register', body:'Prioritised, reproducible and tracked to closure.'}\n        ],\n        tech:['Playwright','Cypress','Jest','k6','JMeter','Appium','OWASP ZAP','GitHub Actions'],\n        approach:'Automation goes where the risk and repetition are, not everywhere. We put quality gates in the pipeline so a failing build cannot be argued past, and we hand the suite to your team rather than keeping it.'\n      },\n      { slug:'data-analytics', name:'Data & analytics', tag:'Pipelines, warehousing, BI, reporting', stage:3,\n        label:'Service 08 / Data & analytics',\n        h1a:'One number', h1b:'everyone agrees on.',\n        sub:'Pipelines, warehousing and reporting built on a single agreed definition of each metric, so your teams stop arguing about whose dashboard is right.',\n        includes:[\n          {n:'01', title:'Data pipelines', body:'Ingestion from your products, tools and third parties.'},\n          {n:'02', title:'Warehouse modelling', body:'Facts, dimensions and a semantic layer that holds up.'},\n          {n:'03', title:'Metric definitions', body:'One agreed formula per metric, version controlled.'},\n          {n:'04', title:'Dashboards', body:'Reporting built for the decision, not the data.'},\n          {n:'05', title:'Data quality', body:'Tests, freshness checks and alerts on the pipeline.'},\n          {n:'06', title:'Self-serve access', body:'Tooling so analysts stop queuing behind engineering.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Working warehouse', body:'Modelled, tested and documented.'},\n          {n:'02', title:'Metric layer', body:'Definitions in code, reviewed like any other change.'},\n          {n:'03', title:'Dashboard set', body:'The reports your leadership actually opens.'},\n          {n:'04', title:'Quality monitors', body:'Alerts before a stakeholder spots the gap.'}\n        ],\n        tech:['dbt','Airflow','Snowflake','BigQuery','PostgreSQL','Metabase','Power BI','Python'],\n        approach:'We start from the decisions you need to make and work backwards to the data, which usually means building far fewer dashboards than requested. Metric definitions live in code so a change is reviewable.'\n      },\n      { slug:'blockchain', name:'Blockchain & Web3', tag:'Contracts, wallets, audits, tokenised systems', stage:0,\n        label:'Service 09 / Blockchain & Web3',\n        h1a:'On-chain systems,', h1b:'off-chain discipline.',\n        sub:'Smart contracts, wallets and tokenised systems built with the same review, testing and audit standards we apply to anything holding money.',\n        includes:[\n          {n:'01', title:'Smart contracts', body:'Written, reviewed and tested before any deployment.'},\n          {n:'02', title:'Wallet integration', body:'Custodial and non-custodial flows users can follow.'},\n          {n:'03', title:'Token systems', body:'Issuance, distribution and vesting mechanics.'},\n          {n:'04', title:'Audit preparation', body:'Documentation and fixes ahead of external audit.'},\n          {n:'05', title:'Indexing and APIs', body:'On-chain data made queryable for your product.'},\n          {n:'06', title:'Off-chain services', body:'The conventional backend most Web3 products still need.'}\n        ],\n        deliverables:[\n          {n:'01', title:'Deployed contracts', body:'Verified, documented and version tagged.'},\n          {n:'02', title:'Test suite', body:'Including adversarial and edge-case scenarios.'},\n          {n:'03', title:'Audit-ready package', body:'Specification, threat model and known tradeoffs.'},\n          {n:'04', title:'Integration layer', body:'APIs your existing product can consume.'}\n        ],\n        tech:['Solidity','Hardhat','Foundry','ethers.js','The Graph','Node.js','IPFS'],\n        approach:'Contracts are immutable once deployed, so review and testing come before enthusiasm. We
